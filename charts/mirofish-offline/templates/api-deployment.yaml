apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mirofish.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mirofish.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  ## The uploads PVC is ReadWriteOnce, so the old pod must release it before
  ## the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mirofish.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mirofish.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if or (not .Values.config.existingSecret) (not .Values.neo4j.auth.existingSecret) }}
        ## Roll the pod when a chart-managed credential changes; env vars from
        ## a Secret are read once at container start.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "mirofish.podCommon" (dict "ctx" .) | nindent 6 }}
      {{- with .Values.api.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      initContainers:
        ## The app fails closed on a missing graph store, so do not start
        ## serving until Neo4j answers on Bolt.
        - name: wait-for-neo4j
          image: {{ include "mirofish.image" (dict "ctx" $ "image" .Values.neo4j.image) }}
          imagePullPolicy: {{ .Values.neo4j.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until cypher-shell -a "$NEO4J_URI" -u "$NEO4J_USER" -p "$NEO4J_PASSWORD" "RETURN 1;" >/dev/null 2>&1; do
                echo "waiting for neo4j at $NEO4J_URI ..."
                sleep 5
              done
              echo "neo4j is up"
          env:
            - name: NEO4J_URI
              value: {{ include "mirofish.neo4j.uri" . | quote }}
            - name: NEO4J_USER
              value: {{ .Values.neo4j.auth.username | quote }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mirofish.neo4j.secretName" . }}
                  key: {{ include "mirofish.neo4j.secretPasswordKey" . }}
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - name: api
          image: {{ include "mirofish.image" (dict "ctx" $ "image" .Values.api.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "mirofish.configMapName" . }}
            {{- with .Values.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mirofish.neo4j.secretName" . }}
                  key: {{ include "mirofish.neo4j.secretPasswordKey" . }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mirofish.secretName" . }}
                  key: {{ include "mirofish.secretLlmApiKeyKey" . }}
            ## CAMEL-AI reads OPENAI_API_KEY; Ollama ignores its value.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mirofish.secretName" . }}
                  key: {{ include "mirofish.secretLlmApiKeyKey" . }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mirofish.secretName" . }}
                  key: {{ include "mirofish.secretFlaskKeyKey" . }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.api.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.api.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.api.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: /app/backend/uploads
            - name: tmp
              mountPath: /tmp
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: uploads
          {{- if .Values.api.persistence.existingClaim }}
          ## An explicit claim is honoured even with persistence disabled --
          ## naming one is a clear statement that you want durable storage.
          persistentVolumeClaim:
            claimName: {{ .Values.api.persistence.existingClaim }}
          {{- else if .Values.api.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mirofish.api.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
