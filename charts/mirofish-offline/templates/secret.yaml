{{- if or (not .Values.config.existingSecret) (not .Values.neo4j.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mirofish.ownSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mirofish.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if not .Values.neo4j.auth.existingSecret }}
  neo4j-password: {{ .Values.neo4j.auth.password | quote }}
  {{- end }}
  {{- if not .Values.config.existingSecret }}
  llm-api-key: {{ .Values.config.llmApiKey | quote }}
  flask-secret-key: {{ include "mirofish.flaskSecretKey" . | quote }}
  {{- end }}
{{- end }}
