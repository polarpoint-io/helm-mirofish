apiVersion: v2
name: mirofish-offline
description: MiroFish-Offline — a fully local multi-agent swarm-intelligence simulation engine, with its Neo4j knowledge graph and Ollama inference server, on Kubernetes.
type: application

# Written by semantic-release from the conventional commits on main; do not
# edit by hand. This is also the tag of the images this chart defaults to,
# because they are built from the same release.
version: 0.2.0

# The upstream MiroFish-Offline release these images are built from, pinned in
# UPSTREAM_REF. semantic-release is configured with onlyUpdateVersion, so it
# leaves this alone — it tracks upstream, not this repo's release cadence.
appVersion: "0.2.0"

kubeVersion: ">=1.25.0-0"

home: https://github.com/polarpoint-io/helm-mirofish
sources:
  - https://github.com/polarpoint-io/helm-mirofish
  - https://github.com/nikmcfly/MiroFish-Offline

keywords:
  - mirofish
  - multi-agent
  - simulation
  - neo4j
  - ollama
  - llm
  - knowledge-graph

maintainers:
  - name: Polarpoint
    url: https://github.com/polarpoint-io

annotations:
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/containsSecurityUpdates: "false"
