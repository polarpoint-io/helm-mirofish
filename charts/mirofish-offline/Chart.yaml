apiVersion: v2
name: mirofish-offline
description: MiroFish-Offline — a fully local multi-agent swarm-intelligence simulation engine, with its Neo4j knowledge graph and Ollama inference server, on Kubernetes.
type: application

# Chart version — bump on any change to the chart itself.
version: 0.1.0

# Version of MiroFish-Offline this chart deploys. Used as the default image tag.
appVersion: "0.2.0"

kubeVersion: ">=1.25.0-0"

home: https://github.com/polarpoint-io/helm-mirofish
sources:
  - https://github.com/polarpoint-io/helm-mirofish
  - https://github.com/nikmcfly/MiroFish-Offline

keywords:
  - mirofish
  - multi-agent
  - simulation
  - neo4j
  - ollama
  - llm
  - knowledge-graph

maintainers:
  - name: Polarpoint
    url: https://github.com/polarpoint-io

annotations:
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/containsSecurityUpdates: "false"
